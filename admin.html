<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; form-action 'none'; base-uri 'self'; object-src 'none'" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex,nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panel superadmin — VehiTrack</title>
<link rel="icon" type="image/png" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
:root{ --ink:#16222F; --ink-2:#1C2C3E; --paper:#F4F6F8; --surface:#fff; --line:#E3E7EC; --text:#16222F; --muted:#5A6577;
  --brand:#0A9D7B; --brand-dp:#077A5F; --brand-soft:#E3F6F1; --rojo:#C62828; --rojo-soft:#FDECEA; --ambar:#B26A00; --ambar-soft:#FFF3DC; --azul:#2A5BD7; --azul-soft:#E8EEFC; }
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
[hidden]{ display:none !important; }
body{ font-family:'Inter',system-ui,sans-serif; background:var(--paper); color:var(--text); line-height:1.5; font-size:14px; }
.hd{ background:var(--ink-2); color:#fff; }
.hd-in{ max-width:1280px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.hd img{ height:38px; background:#fff; border-radius:8px; padding:3px 8px; }
.hd h1{ font-family:'Poppins',sans-serif; font-size:16px; font-weight:700; flex:1; min-width:160px; }
.hd .who{ font-size:12.5px; color:rgba(255,255,255,.75); }
.wrap{ max-width:1280px; margin:0 auto; padding:18px 20px 70px; }
button{ font:inherit; cursor:pointer; }
.btn{ border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:9px; padding:7px 13px; font-weight:600; font-size:13px; }
.btn:hover{ border-color:var(--brand); color:var(--brand-dp); }
.btn.pri{ background:var(--brand); border-color:var(--brand); color:#fff; }
.btn.pri:hover{ background:var(--brand-dp); color:#fff; }
.btn.warn{ background:var(--ambar-soft); border-color:#f0d9a8; color:var(--ambar); }
.btn.sm{ padding:4px 9px; font-size:12px; }
.hd .btn{ background:transparent; color:#fff; border-color:rgba(255,255,255,.35); }
.tabs{ display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:18px; }
.tab{ background:none; border:none; padding:10px 14px; font-weight:600; color:var(--muted); border-bottom:3px solid transparent; }
.tab[aria-selected="true"]{ color:var(--brand-dp); border-bottom-color:var(--brand); }
.cnt{ display:inline-block; min-width:20px; padding:0 6px; border-radius:99px; background:var(--rojo); color:#fff; font-size:11.5px; text-align:center; margin-left:5px; }
.cnt.ok{ background:var(--brand); }
.kpis{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; margin-bottom:18px; }
.kpi{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
.kpi .n{ font-family:'Poppins',sans-serif; font-weight:700; font-size:24px; line-height:1.15; }
.kpi .l{ color:var(--muted); font-size:12.5px; margin-top:2px; }
.kpi.mal .n{ color:var(--rojo); }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
.card h2{ font-family:'Poppins',sans-serif; font-size:14.5px; margin-bottom:12px; }
.charts{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.bars{ display:flex; align-items:flex-end; gap:5px; height:150px; padding-top:18px; }
.bar{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; min-width:0; }
.bar i{ display:block; width:100%; background:var(--brand); border-radius:4px 4px 0 0; min-height:2px; }
.bar.ing i{ background:var(--azul); }
.bar span{ font-size:10.5px; color:var(--muted); margin-top:4px; white-space:nowrap; }
.bar b{ font-size:10.5px; font-weight:600; margin-bottom:2px; }
.tw{ overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface); }
table{ width:100%; border-collapse:collapse; font-size:13px; }
th,td{ padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; white-space:nowrap; }
td.wrapc{ white-space:normal; min-width:220px; max-width:420px; word-break:break-word; }
th{ background:#fafbfc; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); position:sticky; top:0; }
tr:last-child td{ border-bottom:none; }
.mono{ font-family:'JetBrains Mono',monospace; font-size:12px; }
.b{ display:inline-block; padding:2px 9px; border-radius:99px; font-size:11.5px; font-weight:700; }
.b.ok{ background:var(--brand-soft); color:var(--brand-dp); }
.b.mal{ background:var(--rojo-soft); color:var(--rojo); }
.b.med{ background:var(--ambar-soft); color:var(--ambar); }
.b.inf{ background:var(--azul-soft); color:var(--azul); }
.b.gris{ background:#eef1f4; color:var(--muted); }
.filters{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
input,select,textarea{ font:inherit; border:1px solid var(--line); border-radius:9px; padding:7px 10px; background:#fff; }
input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(10,157,123,.14); }
.prob{ border:1px solid var(--line); border-left:5px solid var(--ambar); border-radius:10px; background:var(--surface); padding:11px 14px; margin-bottom:9px; display:flex; gap:12px; align-items:flex-start; justify-content:space-between; }
.prob.alta{ border-left-color:var(--rojo); }
.prob h3{ font-size:13.5px; margin-bottom:2px; }
.prob p{ color:var(--muted); font-size:12.5px; word-break:break-word; }
.prob time{ font-size:11.5px; color:var(--muted); }
.vacio{ padding:26px; text-align:center; color:var(--muted); }
.centro{ max-width:380px; margin:70px auto; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:26px; }
.centro h2{ font-family:'Poppins',sans-serif; margin-bottom:6px; }
.centro p{ color:var(--muted); margin-bottom:14px; }
.centro input{ width:100%; margin-bottom:10px; padding:11px 12px; }
.err{ color:var(--rojo); font-weight:600; margin-top:8px; }
.ov{ position:fixed; inset:0; background:rgba(15,25,35,.55); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
.sheet{ background:var(--surface); border-radius:16px; padding:20px; width:100%; max-width:560px; max-height:88vh; overflow:auto; }
.sheet h3{ font-family:'Poppins',sans-serif; margin-bottom:10px; }
.sheet label{ display:block; font-size:12px; font-weight:700; color:var(--muted); margin:10px 0 4px; text-transform:uppercase; letter-spacing:.04em; }
.sheet input,.sheet textarea{ width:100%; }
.sheet pre{ background:#0f1923; color:#d7e3ee; border-radius:10px; padding:12px; font-size:12px; overflow:auto; max-height:60vh; white-space:pre-wrap; word-break:break-word; }
.acts{ display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
.toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:11px; font-weight:600; z-index:90; }
@media (max-width:760px){ .charts{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<header class="hd"><div class="hd-in">
  <img src="logo.png" alt="VehiTrack" />
  <h1>Panel superadmin</h1>
  <span class="who" id="quien"></span>
  <button class="btn" id="btnRefrescar" hidden>Actualizar</button>
  <button class="btn" id="btnSalir" hidden>Salir</button>
</div></header>

<!-- Estados de acceso -->
<div class="centro" id="vLogin" hidden>
  <h2>Ingreso de administrador</h2>
  <p>Usa tu cuenta de VehiTrack. Solo los superadministradores pueden ver este panel.</p>
  <input id="lgEmail" type="email" placeholder="Correo" autocomplete="username" />
  <input id="lgPass" type="password" placeholder="Contraseña" autocomplete="current-password" />
  <button class="btn pri" id="btnEntrar" style="width:100%;padding:11px">Entrar</button>
  <div class="err" id="lgErr" hidden></div>
</div>
<div class="centro" id="vDenegado" hidden>
  <h2>Acceso denegado</h2>
  <p>Esta cuenta no tiene permisos de superadministrador.</p>
  <button class="btn" id="btnSalir2">Cerrar sesión</button>
</div>
<div class="centro" id="vConfig" hidden>
  <h2>Falta configuración</h2>
  <p>config.js no tiene la URL y la llave de Supabase.</p>
</div>

<main class="wrap" id="vPanel" hidden>
  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="resumen" aria-selected="true">Resumen</button>
    <button class="tab" role="tab" data-tab="problemas" aria-selected="false">Problemas<span class="cnt ok" id="cntProb">…</span></button>
    <button class="tab" role="tab" data-tab="usuarios" aria-selected="false">Usuarios</button>
    <button class="tab" role="tab" data-tab="consultas" aria-selected="false">Consultas</button>
    <button class="tab" role="tab" data-tab="pagos" aria-selected="false">Pagos</button>
    <button class="tab" role="tab" data-tab="eventos" aria-selected="false">Eventos</button>
  </div>
  <section id="p-resumen"></section>
  <section id="p-problemas" hidden></section>
  <section id="p-usuarios" hidden></section>
  <section id="p-consultas" hidden></section>
  <section id="p-pagos" hidden></section>
  <section id="p-eventos" hidden></section>
</main>

<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="config.js"></script>
<script>
const CFG = window.VEHITRACK_CONFIG || {};
const SB_OK = !!(CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes('TU-PROYECTO') && CFG.SUPABASE_ANON_KEY && !CFG.SUPABASE_ANON_KEY.includes('TU-LLAVE'));
const sb = SB_OK ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$ ' + Number(n || 0).toLocaleString('es-CO');
const fecha = iso => iso ? new Date(iso).toLocaleString('es-CO', { timeZone:'America/Bogota', dateStyle:'short', timeStyle:'short' }) : '—';
function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true, 3200); }
const vacio = m => `<div class="vacio">${esc(m)}</div>`;

/* ---------- API ---------- */
class Denegado extends Error {}
async function api(action, params = {}){
  const { data, error } = await sb.functions.invoke('admin', { body: { action, ...params } });
  if (error) {
    let pl = null; try { pl = await error.context.json(); } catch (_) {}
    if (pl?.error === 'prohibido') throw new Denegado();
    if (pl?.error === 'no_autenticado') throw new Denegado('sesion');
    throw new Error(pl?.error || error.message);
  }
  return data;
}

/* ---------- Vistas de acceso ---------- */
function ver(v){ ['vLogin','vDenegado','vConfig','vPanel'].forEach(id => $('#'+id).hidden = id !== v); const dentro = v === 'vPanel'; $('#btnRefrescar').hidden = !dentro; $('#btnSalir').hidden = !dentro; }
async function iniciar(){
  if (!sb) return ver('vConfig');
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return ver('vLogin');
  $('#quien').textContent = session.user.email;
  try { await cargarTab('resumen'); ver('vPanel'); cargarContadorProblemas(); }
  catch (e) { if (e instanceof Denegado) { e.message === 'sesion' ? ver('vLogin') : ver('vDenegado'); } else { ver('vPanel'); $('#p-resumen').innerHTML = vacio('Error al cargar: ' + e.message); } }
}
$('#btnEntrar').onclick = async () => {
  const err = $('#lgErr'); err.hidden = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('#lgEmail').value.trim(), password: $('#lgPass').value });
  if (error) { err.textContent = 'Correo o contraseña incorrectos.'; err.hidden = false; return; }
  $('#lgPass').value = ''; iniciar();
};
$('#lgPass').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnEntrar').click(); });
const salir = async () => { await sb.auth.signOut(); $('#quien').textContent = ''; ver('vLogin'); };
$('#btnSalir').onclick = salir; $('#btnSalir2').onclick = salir;
$('#btnRefrescar').onclick = () => { cargarTab(tabActual); cargarContadorProblemas(); };

/* ---------- Tabs ---------- */
let tabActual = 'resumen';
const filtros = { consultas:{ placa:'', user_id:'', solo_problemas:false }, pagos:{ estado:'' }, eventos:{ nivel:'' } };
$('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) irTab(b.dataset.tab); });
function irTab(t){
  tabActual = t;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  ['resumen','problemas','usuarios','consultas','pagos','eventos'].forEach(x => $('#p-'+x).hidden = x !== t);
  cargarTab(t);
}
async function cargarTab(t){
  const cont = $('#p-'+t); cont.innerHTML = vacio('Cargando…');
  const fn = { resumen:vResumen, problemas:vProblemas, usuarios:vUsuarios, consultas:vConsultas, pagos:vPagos, eventos:vEventos }[t];
  await fn(cont);
}
async function cargarContadorProblemas(){
  try { const { problemas } = await api('problemas'); const c = $('#cntProb'); c.textContent = problemas.length; c.className = 'cnt' + (problemas.length ? '' : ' ok'); } catch (_) {}
}

/* ---------- Resumen ---------- */
function barras(serie, campo, clase, fmt){
  const max = Math.max(1, ...serie.map(s => s[campo]));
  return `<div class="bars">${serie.map(s => `<div class="bar ${clase}" title="${esc(s.dia)}: ${esc(fmt(s[campo]))}"><b>${s[campo] ? esc(fmt(s[campo])) : ''}</b><i style="height:${Math.round(s[campo] / max * 100)}%"></i><span>${esc(s.dia.slice(8))}</span></div>`).join('')}</div>`;
}
async function vResumen(c){
  const r = await api('resumen');
  const k = (n, l, mal) => `<div class="kpi ${mal ? 'mal' : ''}"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`;
  c.innerHTML = `
  <div class="kpis">
    ${k(r.usuarios_total, 'Usuarios registrados')}
    ${k(r.usuarios_nuevos_7d, 'Nuevos (7 días)')}
    ${k(r.consultas_24h, 'Consultas (24 h)')}
    ${k(r.consultas_7d, 'Consultas (7 días)')}
    ${k(r.consultas_total, 'Consultas (total)')}
    ${k(money(r.ingresos_7d), 'Recargas aprobadas (7 días)')}
    ${k(money(r.ingresos_total), 'Recargas aprobadas (total)')}
    ${k(money(r.saldo_en_wallets), 'Saldo de clientes en wallets')}
    ${k(r.recargas_pendientes, 'Recargas pendientes', r.recargas_pendientes > 0)}
  </div>
  <div class="charts">
    <div class="card"><h2>Consultas por día (14 días)</h2>${barras(r.serie, 'consultas', '', x => String(x))}</div>
    <div class="card"><h2>Recargas aprobadas por día (COP)</h2>${barras(r.serie, 'ingresos', 'ing', x => (x/1000).toLocaleString('es-CO') + 'k')}</div>
  </div>`;
}

/* ---------- Problemas ---------- */
async function vProblemas(c){
  const { problemas } = await api('problemas');
  const cnt = $('#cntProb'); cnt.textContent = problemas.length; cnt.className = 'cnt' + (problemas.length ? '' : ' ok');
  if (!problemas.length) { c.innerHTML = `<div class="card">${vacio('Sin problemas detectados en los últimos 7 días. 👍')}</div>`; return; }
  c.innerHTML = problemas.map(p => `
    <div class="prob ${p.severidad === 'alta' ? 'alta' : ''}">
      <div><h3><span class="b ${p.severidad === 'alta' ? 'mal' : 'med'}">${esc(p.severidad)}</span> ${esc(p.titulo)}</h3>
        <p>${esc(p.detalle)}</p><time>${esc(fecha(p.cuando))}</time></div>
      <div>${p.recarga_id ? `<button class="btn sm warn" data-act="aprobar" data-id="${esc(p.recarga_id)}">Aprobar recarga</button>` : ''}${p.consulta_id ? `<button class="btn sm" data-act="detalle" data-id="${esc(p.consulta_id)}">Ver informe</button>` : ''}</div>
    </div>`).join('');
}

/* ---------- Usuarios ---------- */
async function vUsuarios(c){
  const { usuarios } = await api('usuarios');
  if (!usuarios.length) { c.innerHTML = vacio('Sin usuarios.'); return; }
  c.innerHTML = `<div class="filters"><input id="buscaU" placeholder="Buscar por correo…" /><span style="color:var(--muted)">${usuarios.length} usuarios</span></div>
  <div class="tw"><table><thead><tr><th>Correo</th><th>Registro</th><th>Último acceso</th><th>Confirmado</th><th>Saldo</th><th>Recargado</th><th>Consultas</th><th>Última consulta</th><th></th></tr></thead>
  <tbody id="tbU">${usuarios.map(u => `<tr data-mail="${esc((u.email || '').toLowerCase())}">
    <td>${esc(u.email)}</td><td>${esc(fecha(u.created_at))}</td><td>${esc(fecha(u.last_sign_in_at))}</td>
    <td>${u.confirmado ? '<span class="b ok">Sí</span>' : '<span class="b med">No</span>'}</td>
    <td><b>${esc(money(u.saldo))}</b></td><td>${esc(money(u.recargado))}</td><td>${esc(u.consultas)}</td><td>${esc(fecha(u.ultima_consulta))}</td>
    <td><button class="btn sm" data-act="ver-consultas" data-id="${esc(u.id)}">Consultas</button> <button class="btn sm" data-act="acreditar" data-id="${esc(u.id)}" data-mail="${esc(u.email)}">Acreditar</button></td></tr>`).join('')}</tbody></table></div>`;
  $('#buscaU').oninput = e => { const q = e.target.value.toLowerCase(); document.querySelectorAll('#tbU tr').forEach(tr => tr.hidden = !tr.dataset.mail.includes(q)); };
}

/* ---------- Consultas ---------- */
function estFuente(c, nombre, err, sin){
  if (!(c.source || '').includes(nombre)) return '<span class="b gris">—</span>';
  if (err) return `<span class="b mal" title="${esc(err)}">Falló</span>`;
  if (sin === 'true') return '<span class="b inf">Sin resultados</span>';
  return '<span class="b ok">OK</span>';
}
async function vConsultas(c){
  const f = filtros.consultas;
  const { consultas } = await api('consultas', f);
  c.innerHTML = `<div class="filters">
    <input id="fPlaca" placeholder="Placa" maxlength="7" value="${esc(f.placa)}" style="width:110px;text-transform:uppercase" />
    <label><input type="checkbox" id="fProb" ${f.solo_problemas ? 'checked' : ''} /> Solo con problemas</label>
    ${f.user_id ? `<span class="b inf">Filtrado por un usuario <button class="btn sm" id="fQuitaU">quitar</button></span>` : ''}
    <button class="btn pri sm" id="fBuscar">Buscar</button><span style="color:var(--muted)">${consultas.length} resultados (máx. 200)</span></div>
  ${consultas.length ? `<div class="tw"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Placa</th><th>Costo</th><th>InfoSiniestral</th><th>PlacApi</th><th></th></tr></thead><tbody>
  ${consultas.map(x => `<tr><td>${esc(fecha(x.created_at))}</td><td>${esc(x.correo)}</td><td class="mono">${esc(x.placa)}</td><td>${esc(money(x.costo))}</td>
    <td>${estFuente(x, 'infosiniestral', x.info_err, x.info_sin)}</td><td>${estFuente(x, 'placapi', x.pla_err, null)}</td>
    <td><button class="btn sm" data-act="detalle" data-id="${esc(x.id)}">Ver informe</button></td></tr>`).join('')}</tbody></table></div>` : vacio('Sin consultas con esos filtros.')}`;
  $('#fBuscar').onclick = () => { f.placa = $('#fPlaca').value.trim(); f.solo_problemas = $('#fProb').checked; cargarTab('consultas'); };
  $('#fPlaca').addEventListener('keydown', e => { if (e.key === 'Enter') $('#fBuscar').click(); });
  const q = $('#fQuitaU'); if (q) q.onclick = () => { f.user_id = ''; cargarTab('consultas'); };
}

/* ---------- Pagos ---------- */
const estPago = { aprobada:'ok', pendiente:'med', rechazada:'mal' };
async function vPagos(c){
  const f = filtros.pagos;
  const { recargas } = await api('recargas', f);
  c.innerHTML = `<div class="filters"><select id="fEstado">${['','pendiente','aprobada','rechazada'].map(v => `<option value="${v}" ${f.estado === v ? 'selected' : ''}>${v ? v : 'Todos los estados'}</option>`).join('')}</select>
  <span style="color:var(--muted)">${recargas.length} recargas (máx. 200)</span></div>
  ${recargas.length ? `<div class="tw"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Monto</th><th>Estado</th><th>Referencia</th><th>Transacción Wompi</th><th>Edad</th><th></th></tr></thead><tbody>
  ${recargas.map(r => { const atascada = r.estado === 'pendiente' && r.edad_min > 15;
    return `<tr><td>${esc(fecha(r.created_at))}</td><td>${esc(r.correo)}</td><td><b>${esc(money(r.monto))}</b></td>
    <td><span class="b ${estPago[r.estado] || 'gris'}">${esc(r.estado)}</span>${atascada ? ' <span class="b mal">atascada</span>' : ''}</td>
    <td class="mono">${esc(r.reference)}</td><td class="mono">${esc(r.wompi_txn_id || '—')}</td><td>${esc(r.edad_min < 120 ? r.edad_min + ' min' : Math.round(r.edad_min / 60) + ' h')}</td>
    <td>${r.estado === 'pendiente' ? `<button class="btn sm warn" data-act="aprobar" data-id="${esc(r.id)}">Aprobar manual</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div>` : vacio('Sin recargas.')}`;
  $('#fEstado').onchange = e => { f.estado = e.target.value; cargarTab('pagos'); };
}

/* ---------- Eventos ---------- */
async function vEventos(c){
  const f = filtros.eventos;
  const { eventos } = await api('eventos', f);
  const cls = { error:'mal', warn:'med', info:'inf' };
  c.innerHTML = `<div class="filters"><select id="fNivel">${['','error','warn','info'].map(v => `<option value="${v}" ${f.nivel === v ? 'selected' : ''}>${v ? v : 'Todos los niveles'}</option>`).join('')}</select>
  <span style="color:var(--muted)">${eventos.length} eventos (máx. 200)</span></div>
  ${eventos.length ? `<div class="tw"><table><thead><tr><th>Fecha</th><th>Nivel</th><th>Tipo</th><th>Usuario</th><th>Detalle</th></tr></thead><tbody>
  ${eventos.map(e => `<tr><td>${esc(fecha(e.created_at))}</td><td><span class="b ${cls[e.nivel] || 'gris'}">${esc(e.nivel)}</span></td><td>${esc(e.tipo)}</td><td>${esc(e.correo)}</td><td class="wrapc mono">${esc(JSON.stringify(e.detalle ?? {}))}</td></tr>`).join('')}</tbody></table></div>` : vacio('Sin eventos.')}`;
  $('#fNivel').onchange = e => { f.nivel = e.target.value; cargarTab('eventos'); };
}

/* ---------- Modales y acciones ---------- */
const abrir = html => { $('#sheet').innerHTML = html; $('#ov').hidden = false; };
const cerrar = () => { $('#ov').hidden = true; $('#sheet').innerHTML = ''; };
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov' || e.target.closest('[data-act="cerrar"]')) cerrar(); });

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.dataset.act === 'cerrar') return;
  const act = b.dataset.act, id = b.dataset.id;
  try {
    if (act === 'ver-consultas') { filtros.consultas = { placa:'', user_id:id, solo_problemas:false }; irTab('consultas'); }
    else if (act === 'detalle') {
      const { consulta } = await api('consulta_detalle', { id: Number(id) });
      abrir(`<h3>Informe · ${esc(consulta?.placa)} · ${esc(fecha(consulta?.created_at))}</h3><pre id="pre"></pre><div class="acts"><button class="btn" data-act="cerrar">Cerrar</button></div>`);
      $('#pre').textContent = JSON.stringify(consulta?.payload ?? {}, null, 2);   // textContent: nunca se interpreta como HTML
    }
    else if (act === 'acreditar') {
      abrir(`<h3>Acreditar saldo</h3><p style="color:var(--muted)">${esc(b.dataset.mail)}</p>
        <label for="aMonto">Monto (COP)</label><input id="aMonto" type="number" min="1" max="500000" step="1" />
        <label for="aMotivo">Motivo (queda registrado)</label><textarea id="aMotivo" rows="2" maxlength="200"></textarea>
        <div class="err" id="aErr" hidden></div>
        <div class="acts"><button class="btn" data-act="cerrar">Cancelar</button><button class="btn pri" id="aOk">Acreditar</button></div>`);
      $('#aOk').onclick = async () => {
        const monto = Number($('#aMonto').value), motivo = $('#aMotivo').value.trim(), er = $('#aErr');
        if (!Number.isInteger(monto) || monto < 1 || motivo.length < 3) { er.textContent = 'Escribe un monto entero y un motivo.'; er.hidden = false; return; }
        $('#aOk').disabled = true;
        try { const r = await api('acreditar', { user_id: id, monto, motivo }); cerrar(); toast('Listo. Saldo nuevo: ' + money(r.saldo)); cargarTab(tabActual); }
        catch (x) { er.textContent = 'No se pudo: ' + x.message; er.hidden = false; $('#aOk').disabled = false; }
      };
    }
    else if (act === 'aprobar') {
      if (!confirm('Aprueba SOLO si ya confirmaste en el panel de Wompi que este pago está APROBADO.\n\nSe sumará el saldo al usuario. ¿Continuar?')) return;
      const r = await api('aprobar_recarga', { id: Number(id) });
      toast('Recarga aprobada. Saldo del usuario: ' + money(r.saldo)); cargarTab(tabActual); cargarContadorProblemas();
    }
  } catch (x) {
    if (x instanceof Denegado) return iniciar();
    toast('Error: ' + (x.message === 'recarga_no_pendiente' ? 'esa recarga ya no está pendiente' : x.message));
  }
});

iniciar();
</script>
</body>
</html>
